name: Windows Build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build Windows package
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build Python CLI
        run: |
          pyinstaller --clean --onefile --name image_cli --paths backend backend/image_cli.py

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.1"
          host: "windows"
          target: "desktop"
          arch: "win64_msvc2022_64"

      - name: Configure frontend
        shell: pwsh
        run: |
          cmake -S frontend -B frontend/build -DQt6_DIR="$env:Qt6_DIR"

      - name: Build frontend
        run: |
          cmake --build frontend/build --config Release

      - name: Prepare release folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release/ImgShift-Tool-windows
          Copy-Item frontend/build/Release/ImgShift-Tool.exe release/ImgShift-Tool-windows/
          Copy-Item dist/image_cli.exe release/ImgShift-Tool-windows/

      - name: Deploy Qt runtime
        shell: pwsh
        run: |
          windeployqt release/ImgShift-Tool-windows/ImgShift-Tool.exe

      - name: Create zip
        shell: pwsh
        run: |
          Compress-Archive -Path release/ImgShift-Tool-windows -DestinationPath ImgShift-Tool-windows.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ImgShift-Tool-windows
          path: ImgShift-Tool-windows.zip
